<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МорфоКвест — бес әлем</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#f9f7ff;background:#0b1027}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#263e73,#0b1027 75%);min-height:100vh}.shell{max-width:1050px;margin:auto;padding:18px}header{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:25px;letter-spacing:.5px}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#ffffff18;border:1px solid #ffffff30;border-radius:30px;padding:9px 15px;font-weight:700}.panel{margin-top:16px;border:1px solid #ffffff35;border-radius:24px;background:linear-gradient(150deg,#202c57ef,#121a3aef);padding:20px;box-shadow:0 22px 60px #0006}h1{font-size:clamp(25px,4vw,38px);margin:0 0 8px}h2{margin:8px 0 12px}.sub{color:#d3dbff;line-height:1.6}.btn{border:0;border-radius:13px;background:#ffc75b;color:#2c2141;font-size:16px;font-weight:800;padding:12px 18px;cursor:pointer;box-shadow:0 5px 0 #bd822a}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #bd822a}.btn.secondary{background:#6376ad;color:white;box-shadow:0 5px 0 #35436d}.btn:disabled{opacity:.4;cursor:not-allowed}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.scene{border:2px solid #8793c4;border-radius:20px;overflow:hidden;background:#1d2a4b;position:relative}.scene canvas{display:block;width:100%;touch-action:none}.hint{padding:10px 14px;background:#fff1a31c;border:1px solid #ffda7555;border-radius:12px;margin:12px 0;line-height:1.55}.good{color:#86ffb7}.bad{color:#ffc0c0}.flex{display:flex;gap:12px;flex-wrap:wrap}.tile{padding:14px;border-radius:15px;border:2px solid #8fa4ed;background:#344a82;color:#fff;font-size:18px;font-weight:800;cursor:grab;user-select:none;touch-action:manipulation}.tile:disabled{opacity:.25}.drop{min-height:90px;padding:14px;border:2px dashed #a3b5ff;border-radius:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{background:#ffffff12;border:1px solid #ffffff30;border-radius:15px;padding:14px}.hidden{display:none!important}.objects{position:relative;min-height:360px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#64558b,#24274f 70%);border:2px solid #9689d4}.obj{position:absolute;font-size:38px;border:2px solid #c8a6ff;background:#ffffff18;border-radius:18px;padding:12px;cursor:pointer;transition:transform .15s}.obj:hover{transform:scale(1.08)}.obj.done{border-color:#71f7b6;background:#1c745977}.progress{height:14px;border-radius:15px;background:#ffffff2b;overflow:hidden}.progress>div{height:100%;background:#69f1ae;transition:width .25s}.word{font-weight:900;font-size:clamp(24px,4vw,37px);letter-spacing:1px;text-align:center;padding:20px;background:#ffffff13;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.path{background:#304773;border:2px solid #91b4ee;border-radius:15px;min-height:95px;padding:15px;cursor:pointer;font-weight:800;color:#fff;font-size:17px}.path:hover{background:#4d679a}.arena{min-height:290px;border-radius:20px;background:radial-gradient(circle,#62457c,#202548);position:relative;overflow:hidden;padding:15px}.enemy{font-size:90px;text-align:center;animation:bob 1.8s infinite alternate}.orbs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.orb{width:110px;height:110px;border-radius:50%;border:3px solid #ffe99d;background:radial-gradient(circle,#b45fc4,#5e3484);color:white;font-weight:900;font-size:17px;cursor:pointer}.orb:active{transform:scale(.92)}@keyframes bob{to{transform:translateY(-10px)}}input{font-size:17px;border-radius:12px;border:2px solid #8c9cd3;padding:12px;background:#101936;color:#fff;max-width:100%}.small{font-size:13px;color:#c6d0f4}.scoreboard{width:100%;border-collapse:collapse}.scoreboard td,.scoreboard th{padding:12px;border-bottom:1px solid #ffffff30;text-align:left}.mobile{display:flex;gap:10px;justify-content:center;margin:10px 0}.mobile button{min-width:75px}.feedback{font-weight:800;min-height:28px;margin-top:12px}footer{text-align:center;color:#aeb9db;font-size:12px;padding:20px}</style></head><body><div class="shell"><header><div class="brand">🧭 МОРФОКВЕСТ <span class="small">5–6-сынып</span></div><div class="stats"><div class="pill">🏅 <span id="score">0</span></div><div class="pill">❤️ <span id="hearts">3</span></div><div class="pill">⏱ <span id="clock">00:00</span></div><div class="pill">🗝 <span id="level">0/5</span></div></div></header><main id="app" class="panel"></main><footer>Офлайн ойын • Бір құрылғыда кезекпен командалық жарыс • Жауап нұсқаларын таңдайтын тест емес</footer></div><script>
'use strict';const app=document.getElementById('app');let team='',score=0,hearts=3,level=0,start=0,elapsed=0,ticker=null,locked=false;let leaderboard=[];try{leaderboard=JSON.parse(localStorage.getItem('morphoScores')||'[]')}catch(e){}const $=id=>document.getElementById(id);function update(){ $('score').textContent=score;$('hearts').textContent=hearts;$('level').textContent=level+'/5';}function time(){let s=Math.floor((Date.now()-start)/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function msg(s,ok=true){let x=$('feedback');if(x){x.textContent=s;x.className='feedback '+(ok?'good':'bad')}}function gain(n=100){score+=n;update()}function mistake(s){hearts=Math.max(0,hearts-1);update();msg(s,false);if(hearts===0){clearInterval(ticker);setTimeout(()=>{app.innerHTML='<h1>💔 Миссия тоқтады</h1><p class="sub">Жүректер таусылды. Команда тапсырмаларды қайта орындай алады.</p><button class="btn" onclick="home()">Басынан бастау</button>'},450)}}function alive(){return hearts>0}function complete(){if(!alive()||locked)return;locked=true;gain(200);msg('🎉 Әлем ашылды! +200 ұпай');setTimeout(()=>{if(!alive())return;level++;update();locked=false;if(level===5)finish();else renderLevel()},900)}function home(){clearInterval(ticker);level=0;score=0;hearts=3;update();$('clock').textContent='00:00';app.innerHTML=`<h1>🌌 Сөздер әлемін құтқар!</h1><p class="sub">Бес әлемнің сиқыры жоғалған. Кейіпкерді жүргіз, морфемаларды құрастыр, заттарды зертте, көпір сал және финалдағы сөз құбыжығын жең! Әр әлемде басқару тәсілі өзгереді.</p><div class="grid"><div class="card">🌲 1. Сөз аулау — қозғалыс</div><div class="card">⚗️ 2. Реактор — құрастыру</div><div class="card">🔎 3. Құпия бөлме — зерттеу</div><div class="card">🌉 4. Көпір — логика</div><div class="card">🐉 5. Шайқас — жылдамдық</div></div><p class="hint">🏆 Жарыс: әр команда бір құрылғыда кезекпен ойнайды. Уақыт пен ұпай салыстырылады. Телефондар арасындағы тікелей онлайн рейтинг бұл нұсқада жоқ.</p><label>Команда атауы<br><input id="team" maxlength="25" placeholder="Мысалы: Тұлпарлар"></label><div class="btnrow"><button class="btn" id="begin">🚀 Ойынды бастау</button><button class="btn secondary" id="rank">🏆 Рейтинг</button></div>`;$('begin').onclick=()=>{team=$('team').value.trim()||'Команда';start=Date.now();ticker=setInterval(time,1000);level=0;renderLevel()};$('rank').onclick=showRank}function showRank(){app.innerHTML='<h1>🏆 Командалар рейтингі</h1><p class="sub">Бір браузерде аяқталған ойындар сақталады.</p><table class="scoreboard"><tr><th>Орын</th><th>Команда</th><th>Ұпай</th><th>Уақыт</th></tr>'+leaderboard.sort((a,b)=>b.score-a.score||a.seconds-b.seconds).slice(0,20).map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(r.name)}</td><td>${r.score}</td><td>${r.seconds} с</td></tr>`).join('')+'</table><div class="btnrow"><button class="btn" onclick="home()">Ойнау</button></div>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderLevel(){update();if(level===0)forest();else if(level===1)lab();else if(level===2)room();else if(level===3)bridge();else boss()}
// LEVEL 1: actual animated canvas movement, catch nouns, avoid other words
let forestRun=null;function forest(){app.innerHTML=`<h1>🌲 1. Сиқырлы орман</h1><p class="sub">Орманға сөздер түсіп жатыр! Кейіпкерді солға/оңға жылжытып, <b>тек зат есімдерді</b> ұста. 7 зат есім жина. Басқа сөздерге тиме!</p><div class="scene"><canvas id="forest" width="900" height="390"></canvas></div><div class="mobile"><button class="btn secondary" id="left">◀ Солға</button><button class="btn secondary" id="right">Оңға ▶</button></div><div class="hint">⌨️ Пернетақта: ← → немесе A D. Телефонда төмендегі батырмалар. Жиналды: <b id="caught">0/7</b></div><div id="feedback" class="feedback"></div>`;const cv=$('forest'),ctx=cv.getContext('2d');let x=450,items=[],caught=0,frames=0,keys={};const words=[['кітап',1],['ойнады',0],['орман',1],['әдемі',0],['мектеп',1],['жүгірді',0],['қалам',1],['биік',0],['өзен',1],['жазды',0],['дос',1],['жасыл',0],['бала',1],['ойланды',0],['дәптер',1],['жылы',0]];let seed=0,active=true;function down(e){if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))e.preventDefault();keys[e.key]=true}function up(e){keys[e.key]=false}window.addEventListener('keydown',down);window.addEventListener('keyup',up);const setTouch=(id,key)=>{let b=$(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[key]=false};setTouch('left','ArrowLeft');setTouch('right','ArrowRight');function cleanup(){active=false;window.removeEventListener('keydown',down);window.removeEventListener('keyup',up)}function frame(){if(!active)return;if(level!==0||!alive()){cleanup();return}frames++;if(keys.ArrowLeft||keys.a||keys.A)x-=6;if(keys.ArrowRight||keys.d||keys.D)x+=6;x=Math.max(50,Math.min(850,x));if(frames%68===0){let w=words[seed++%words.length];items.push({x:70+Math.random()*740,y:-30,w:w[0],noun:w[1]})}ctx.fillStyle='#183e48';ctx.fillRect(0,0,900,390);ctx.fillStyle='#2c6a64';for(let i=0;i<13;i++){let tx=i*78+15;ctx.beginPath();ctx.moveTo(tx,325);ctx.lineTo(tx+35,110+(i%3)*25);ctx.lineTo(tx+70,325);ctx.fill()}ctx.fillStyle='#426b4d';ctx.fillRect(0,350,900,40);ctx.font='55px system-ui';ctx.textAlign='center';ctx.fillText('🧙',x,351);ctx.font='bold 22px system-ui';items.forEach(it=>{it.y+=2.6;ctx.fillStyle=it.noun?'#e6d4ff':'#ffcab8';let width=ctx.measureText(it.w).width+35;ctx.fillRect(it.x-width/2,it.y-27,width,37);ctx.fillStyle='#15243c';ctx.fillText(it.w,it.x,it.y);if(it.y>305&&it.y<350&&Math.abs(it.x-x)<Math.max(65,width/2)){it.y=1000;if(it.noun){caught++;gain(80);$('caught').textContent=caught+'/7';msg('✨ Зат есім жиналды!')}else{mistake('⚡ Бұл зат есім емес!');if(!alive())cleanup()}}});items=items.filter(it=>it.y<410);if(caught>=7){cleanup();complete();return}requestAnimationFrame(frame)}requestAnimationFrame(frame)}
// LEVEL 2: word building without showing the answer
function lab(){let puzzles=[{clue:'Оқушының білім алатын орны. «мектеп» түбіріне барыс септік жалғауын қос.',base:'мектеп',pieces:['-ке','-тен','-тер','-тің'],answer:['-ке'],explain:'мектеп + ке = мектепке (барыс септік)'},{clue:'«дос» сөзін көпше түрде, І жақ көпше тәуелді түрде жаса.',base:'дос',pieces:['-тар','-тарымыз','-тарым','-қа','-ымыз'],answer:['-тар','-ымыз'],explain:'дос + тар + ымыз = достарымыз'},{clue:'«өнер» түбірінен адамды білдіретін туынды зат есім жаса.',base:'өнер',pieces:['-лі','-паз','-ге','-лер'],answer:['-паз'],explain:'өнер + паз = өнерпаз'}];let idx=0,selected=[];app.innerHTML=`<h1>⚗️ 2. Морфема реакторы</h1><p class="sub">Сиқырлы машинаны іске қос! Дайын сөз берілмейді: мағынаны оқып, дұрыс қосымшаларды ретімен құрастыр. Артық бөлшектер бар.</p><div class="card"><div id="labclue" class="hint"></div><h2>Реактор</h2><div class="drop" id="drop"></div><h2>Бөлшектер</h2><div class="flex" id="pieces"></div><div class="btnrow"><button class="btn" id="check">⚡ Реакторды іске қос</button><button class="btn secondary" id="undo">↶ Соңғысын қайтар</button></div><div id="feedback" class="feedback"></div></div><p class="small">Тәжірибе <span id="step">1</span>/3</p>`;function draw(){let p=puzzles[idx];$('labclue').textContent=p.clue;$('step').textContent=idx+1;$('drop').innerHTML='<span class="tile" style="background:#285f60">'+p.base+'</span>'+selected.map((v,i)=>`<button class="tile" data-remove="${i}">${v}</button>`).join('');$('pieces').innerHTML=p.pieces.map((v,i)=>`<button class="tile" data-add="${i}" ${selected.includes(v)?'disabled':''}>${v}</button>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{selected.push(p.pieces[+b.dataset.add]);draw()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.splice(+b.dataset.remove,1);draw()})}$('undo').onclick=()=>{selected.pop();draw()};$('check').onclick=()=>{let p=puzzles[idx];if(selected.join('|')===p.answer.join('|')){gain(180);msg('✨ '+p.explain);idx++;selected=[];if(idx===puzzles.length){setTimeout(complete,850)}else setTimeout(()=>{if(level===1&&alive()){draw();msg('Келесі тәжірибені орында!')}},900)}else mistake('Қосымшалардың мағынасы мен ретін қайта ойлан!')};draw()}
// LEVEL 3: visual object exploration with visible collected digits
function room(){const clues=[{id:'book',emoji:'📚',name:'Кітап',x:10,y:14,text:'«балалар» сөзіндегі көптік жалғаудың әріп саны',answer:'3',explain:'-лар — үш әріп.'},{id:'clock',emoji:'🕰️',name:'Сағат',x:70,y:12,text:'«оқушы» сөзіндегі буын саны',answer:'3',explain:'о-қу-шы — үш буын.'},{id:'chest',emoji:'🧰',name:'Сандық',x:13,y:66,text:'«достарымыз» сөзіндегі жалғау саны (көптік және тәуелдік)',answer:'2',explain:'-тар және -ымыз — екі жалғау.'},{id:'mirror',emoji:'🪞',name:'Айна',x:70,y:65,text:'«кітапқа» сөзіндегі септік жалғауының әріп саны',answer:'2',explain:'-қа — екі әріп.'}];let found={};app.innerHTML=`<h1>🔎 3. Құпия мұрағат</h1><p class="sub">Бөлмедегі заттарды басып зертте. Әр зат морфологиялық жұмбақ жасырады. Дұрыс санды енгізсең, құлып кодының бір бөлігі ашылады.</p><div class="objects" id="objects"></div><div id="riddle" class="card" style="margin-top:12px">🕵️ Алдымен бір затты зертте.</div><div class="hint">🔐 Табылған код: <b id="digits">_ _ _ _</b> <span class="small">(Кітап → Сағат → Сандық → Айна)</span></div><div class="btnrow"><button class="btn" id="unlock" disabled>Құлыпты аш 🔓</button></div><div id="feedback" class="feedback"></div>`;const objs=$('objects');clues.forEach(c=>{let b=document.createElement('button');b.className='obj';b.style.left=c.x+'%';b.style.top=c.y+'%';b.innerHTML=c.emoji+'<div style="font-size:14px">'+c.name+'</div><div class="small" id="mark-'+c.id+'">?</div>';b.onclick=()=>{if(found[c.id]){msg(c.name+': '+found[c.id]);return}$('riddle').innerHTML=`<b>${c.emoji} ${c.name}</b><p>${c.text}</p><input id="guess" inputmode="numeric" maxlength="2" placeholder="Санды жаз"><button class="btn" id="solve">Тексеру</button>`;$('solve').onclick=()=>{if($('guess').value.trim()===c.answer){found[c.id]=c.answer;b.classList.add('done');$('mark-'+c.id).textContent=c.answer;gain(100);msg('🔎 '+c.explain);$('riddle').textContent=c.name+' — '+c.explain;let code=clues.map(q=>found[q.id]||'_');$('digits').textContent=code.join(' ');$('unlock').disabled=code.includes('_')}else mistake('Санды қайта есепте. Сөзді бөліктерге ажырат!')}};objs.appendChild(b)});$('unlock').onclick=()=>{msg('🔓 Құлып ашылды! Код: '+clues.map(q=>found[q.id]).join(''));complete()}}
// LEVEL 4: puzzle path building, not multiple choice
function bridge(){const challenges=[{clue:'«қалам» сөзін көпше түрде құрастыр.',root:'қалам',options:['-дар','-лар','-ға','-ым'],answer:'-дар',explain:'қалам + дар = қаламдар'},{clue:'«мектеп» сөзін жатыс септігіне қой.',root:'мектеп',options:['-та','-те','-қа','-тен'],answer:'-те',explain:'мектеп + те = мектепте'},{clue:'«қала» сөзін шығыс септігіне қой.',root:'қала',options:['-дан','-нан','-ға','-лар'],answer:'-дан',explain:'қала + дан = қаладан'},{clue:'«дос» сөзін І жақ жекеше тәуелде.',root:'дос',options:['-ым','-ім','-ың','-тар'],answer:'-ым',explain:'дос + ым = досым'}];let idx=0;app.innerHTML=`<h1>🌉 4. Құлаған көпір</h1><p class="sub">Өзеннен өту үшін төрт тас көпірді қалпына келтір. Әр тас — дұрыс жалғанған сөз. Тастарды орнатқанда кейіпкер арғы бетке жақындайды.</p><div class="scene"><canvas id="bridgeCanvas" width="900" height="300"></canvas></div><div id="bridgeClue" class="hint"></div><div class="flex" id="bridgeOptions"></div><div id="feedback" class="feedback"></div>`;const c=$('bridgeCanvas'),ctx=c.getContext('2d');function draw(){ctx.fillStyle='#4b8ab1';ctx.fillRect(0,0,900,300);ctx.fillStyle='#5e8a56';ctx.fillRect(0,0,115,300);ctx.fillRect(785,0,115,300);for(let i=0;i<4;i++){ctx.fillStyle=i<idx?'#f9c66b':'#2c4964';ctx.fillRect(130+i*160,175,145,55);ctx.fillStyle='#1d253e';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText(i<idx?'✓':'?',203+i*160,210)}ctx.font='52px system-ui';ctx.fillText('🧙',70+idx*165,170);ctx.fillText('🏰',845,150)}function render(){if(idx>=4){complete();return}let p=challenges[idx];$('bridgeClue').innerHTML='<b>Тас '+(idx+1)+'/4:</b> '+p.clue+'<br><span class="small">Түбір: '+p.root+'</span>';$('bridgeOptions').innerHTML='';p.options.forEach(o=>{let b=document.createElement('button');b.className='tile';b.textContent=p.root+o;b.onclick=()=>{if(o===p.answer){idx++;gain(130);draw();msg('🪨 '+p.explain);setTimeout(()=>{if(level===3&&alive())render()},600)}else mistake('Бұл жалғау сәйкес келмейді. Дыбыс үндестігін ескер!')};$('bridgeOptions').appendChild(b)})}draw();render()}
// LEVEL 5: timed reflex action with actual word classification; no A/B/C/D question
function boss(){let rounds=[{word:'ормандар',target:'көптік жалғау',correct:'-дар',wrong:['-лар','-ға']},{word:'кітапқа',target:'барыс септік',correct:'-қа',wrong:['-ке','-ты']},{word:'баланың',target:'ілік септік',correct:'-ның',wrong:['-ға','-лар']},{word:'мектептер',target:'көптік жалғау',correct:'-тер',wrong:['-дар','-те']},{word:'досым',target:'І жақ жекеше тәуелдік',correct:'-ым',wrong:['-ың','-тар']},{word:'қаладан',target:'шығыс септік',correct:'-дан',wrong:['-ға','-лар']}];let idx=0,seconds=60,interval=null;app.innerHTML=`<h1>🐉 5. Айдаһармен шайқас</h1><p class="sub">Айдаһар сөздерді сиқырлап жіберді! Әр сөзден берілген мағынадағы қосымшаны жылдам ұстап, айдаһардың күшін азайт. 60 секунд ішінде 6 соққы жаса!</p><div class="arena"><div class="enemy">🐉</div><div class="progress"><div id="hp" style="width:100%"></div></div><p style="text-align:center">Айдаһардың күші: <b id="hpText">6/6</b> · ⏳ <b id="countdown">60</b> с</p><div class="word" id="bossWord"></div><p id="target" style="text-align:center;font-weight:700"></p><div class="orbs" id="orbs"></div></div><div id="feedback" class="feedback"></div>`;function render(){if(idx>=rounds.length){clearInterval(interval);complete();return}let p=rounds[idx];$('bossWord').textContent=p.word;$('target').textContent='Ұста: '+p.target;$('hp').style.width=(100*(rounds.length-idx)/rounds.length)+'%';$('hpText').textContent=(rounds.length-idx)+'/6';let opts=[p.correct,...p.wrong].sort(()=>Math.random()-.5);$('orbs').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='orb';b.textContent=o;b.onclick=()=>{if(!alive())return;if(o===p.correct){gain(160);idx++;msg('💥 Дәл соққы!');render()}else mistake('⚡ Айдаһар қорғанды! Қосымшаны қайта қара.')};$('orbs').appendChild(b)})}interval=setInterval(()=>{if(level!==4||!alive()){clearInterval(interval);return}seconds--;$('countdown').textContent=seconds;if(seconds<=0){clearInterval(interval);mistake('⏳ Уақыт аяқталды!');if(alive()){seconds=30;msg('Қосымша 30 секунд берілді. 1 жүрек жоғалттың.',false);interval=setInterval(()=>{if(level!==4||!alive()){clearInterval(interval);return}seconds--;$('countdown').textContent=seconds;if(seconds<=0){clearInterval(interval);mistake('Уақыт қайта аяқталды!')}},1000)}}},1000);render()}
function finish(){clearInterval(ticker);elapsed=Math.floor((Date.now()-start)/1000);leaderboard.push({name:team,score,seconds:elapsed});try{localStorage.setItem('morphoScores',JSON.stringify(leaderboard))}catch(e){}app.innerHTML=`<h1>🏆 Жеңіс! Сөздер әлемі құтқарылды!</h1><p class="sub">Команда: <b>${escapeHtml(team)}</b></p><div class="grid"><div class="card"><h2>⭐ ${score}</h2>Ұпай</div><div class="card"><h2>⏱ ${elapsed} с</h2>Уақыт</div><div class="card"><h2>❤️ ${hearts}</h2>Қалған жүрек</div></div><p class="hint">Басқа команданы ойнатып, нәтижелерді салыстыр!</p><div class="btnrow"><button class="btn" onclick="home()">Келесі команда</button><button class="btn secondary" onclick="showRank()">🏆 Рейтинг</button></div>`;update()}home();
</script></body></html>
